version: "3.9"

services:

  lb:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
      - "9090:9090"

    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    build:
      context: .
      dockerfile: Backend.Dockerfile
    command: ./echo_server 9001

  backend2:
    build:
      context: .
      dockerfile: Backend.Dockerfile
    command: ./echo_server 9002

  backend3:
    build:
      context: .
      dockerfile: Backend.Dockerfile
    command: ./echo_server 9003